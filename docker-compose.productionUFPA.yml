# docker-compose.productionUFPA.yml
# Produção — VM UFPA (fasitech.cameta.ufpa.br / 172.16.28.198)
version: '3.8'

services:
  # BFF — FastAPI (Clean Architecture)
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: fasitech-api-prod
    expose:
      - "8000"
    environment:
      - PYTHONPATH=/app
      - API_BASE_URL=https://fasitech.cameta.ufpa.br/api
      - ENVIRONMENT=production
      - RAG_DOCUMENTS_DIR=/app/resources
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - .env.production
    volumes:
      - ./credentials:/app/credentials:ro
      - ./config:/app/config:ro
      - ./resources:/app/resources:ro
      - app_cache:/home/apiuser/.cache
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fasitech-network
      - proxy_network

  # Frontend React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ''
    container_name: fasitech-frontend-prod
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fasitech-network

  # Ollama — Embeddings locais (nomic-embed-text)
  ollama:
    image: ollama/ollama:latest
    container_name: fasitech-ollama-prod
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - fasitech-network

  # Redis — Cache/Sessions para Chatwoot
  redis-chatwoot:
    image: redis:7-alpine
    container_name: fasitech-redis-chatwoot-prod
    expose:
      - "6379"
    restart: unless-stopped
    volumes:
      - redis_chatwoot_data:/data
    networks:
      - fasitech-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL — Banco para Chatwoot
  postgres-chatwoot:
    image: postgres:15-alpine
    container_name: fasitech-postgres-chatwoot-prod
    environment:
      - POSTGRES_USER=chatwoot
      - POSTGRES_PASSWORD=chatwoot_secure_pass_2024
      - POSTGRES_DB=chatwoot
    expose:
      - "5432"
    restart: unless-stopped
    volumes:
      - postgres_chatwoot_data:/var/lib/postgresql/data
    networks:
      - fasitech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chatwoot — Live Chat & Support Platform
  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: fasitech-chatwoot-prod
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=a5e3d9c2f8b1a4e6d9f2c5b8e1a4d7e0a3c6f9b2e5d8a1c4f7a0d3e6b9c2f5
      - FRONTEND_URL=https://chatwoot.fasitech.cameta.ufpa.br
      - MAILER_SENDER_NAME=FasiTech Chatwoot
      - MAILER_SENDER_EMAIL=fasicuntins@ufpa.br
      - SMTP_ADDRESS=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=fasicuntins@ufpa.br
      - SMTP_PASSWORD=${EMAIL_PASSWORD}
      - SMTP_AUTHENTICATION=login
      - SMTP_ENABLE_STARTTLS_AUTO=true
      - DATABASE_URL=postgresql://chatwoot:chatwoot_secure_pass_2024@postgres-chatwoot:5432/chatwoot
      - REDIS_URL=redis://redis-chatwoot:6379
      - ACCOUNT_NAME=FasiTech
      - USE_INBOX_AVATAR_FOR_BOT=true
    expose:
      - "3000"
    depends_on:
      postgres-chatwoot:
        condition: service_healthy
      redis-chatwoot:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fasitech-network
    volumes:
      - chatwoot_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Proxy Reverso com SSL Let's Encrypt
  nginx:
    image: nginx:alpine
    container_name: fasitech-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_UFPA_CONF:-./docker/nginx/nginx.ufpa.conf}:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend
      - chatwoot
    restart: always
    networks:
      - fasitech-network
      - proxy_network

networks:
  fasitech-network:
    driver: bridge
  proxy_network:
    external: true

volumes:
  ollama_models:
  app_cache:
  chatwoot_storage:
  postgres_chatwoot_data:
  redis_chatwoot_data:
