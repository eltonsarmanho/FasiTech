<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal Acadêmico da FASI — Faculdade de Sistemas de Informação da UFPA" />
    <title>FasiTech — Portal Acadêmico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Chatwoot Widget (carregamento automático) -->
    <script>
      window.chatwootSettings = {"position":"right","type":"standard","launcherTitle":""};
      (function(d,t) {
        var BASE_URL="https://chatwoot.fasitech.cameta.ufpa.br";
        var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
        g.src=BASE_URL+"/packs/js/sdk.js";
        g.async = true;
        g.id = "chatwoot-sdk-global";
        s.parentNode.insertBefore(g,s);
        g.onload=function(){
          if (window.chatwootSDK) {
            window.chatwootSDK.run({
              websiteToken: 'oUy6xunsEJMzcXDvzscMHj7M',
              baseUrl: BASE_URL
            })
          }
        }
        g.onerror=function(){
          console.warn("Chatwoot SDK não disponível");
        }
      })(document,"script");
    </script>
  </body>
</html>
